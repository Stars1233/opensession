<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1Password request</title>
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="onepassword-approval.css" />
    <script src="onepassword-approval-page.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <header>
        <p class="eyebrow">1Password · Approve once</p>
        <h1 id="title">Use one 1Password secret?</h1>
        <p class="message">
          Review the field and destination before granting access.
        </p>
      </header>
      <pre id="details" tabindex="0" aria-label="Request details">
Loading request…</pre>
      <footer>
        <p class="message">
          The secret stays on your Mac until sent to the approved API.
        </p>
        <div class="actions">
          <button class="button secondary" id="decline" type="button" autofocus>
            Decline
          </button>
          <button class="button" id="approve" type="button" disabled>
            Approve once
          </button>
        </div>
      </footer>
    </main>
  </body>
</html>
