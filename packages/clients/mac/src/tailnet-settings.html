<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Tailscale profiles</title>
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="tailnet.css" />
    <script src="tailnet-settings.js" defer></script>
  </head>
  <body>
    <main class="tailnet">
      <h1>Tailscale profiles</h1>
      <p class="message">
        Choose a tailnet for each organization. These settings stay on this Mac.
      </p>
      <form id="form">
        <label for="organization">Organization</label>
        <select class="field" id="organization" disabled></select>
        <label for="profile">Tailscale profile</label>
        <select class="field" id="profile" disabled>
          <option value="">Don't change Tailscale</option>
        </select>
        <p class="message warning">
          Switching changes the network for your whole Mac. Other apps and
          organization windows may disconnect.
        </p>
        <div class="actions">
          <button class="button" id="connect" type="submit" disabled>
            Save and connect
          </button>
          <button class="button ghost" id="save" type="button" disabled>
            Save only
          </button>
          <button class="button ghost" id="close" type="button">Close</button>
        </div>
      </form>
      <div class="actions secondary">
        <button class="button ghost" id="refresh" type="button">
          Refresh profiles
        </button>
        <button class="button ghost" id="open" type="button">
          Open Tailscale
        </button>
      </div>
      <p id="status" role="status" aria-live="polite">
        Reading local profiles…
      </p>
    </main>
  </body>
</html>
