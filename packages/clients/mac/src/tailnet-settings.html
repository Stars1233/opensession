<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Tailscale profiles</title>
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="tailnet.css" />
    <script src="tailnet-settings.js" defer></script>
  </head>
  <body class="tailnet-backdrop">
    <main
      class="tailnet settings-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="title"
      aria-describedby="description"
    >
      <button
        class="button icon-button close"
        id="close"
        type="button"
        aria-label="Close Tailscale profiles"
        title="Close"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <h1 id="title">Tailscale profiles</h1>
      <p class="message" id="description">
        Choose a tailnet for each organization. Saved only on this Mac.
      </p>
      <form id="form">
        <label for="organization">Organization</label>
        <select class="field" id="organization" disabled></select>
        <div class="field-heading">
          <label for="profile">Tailnet</label>
          <button
            class="button icon-button"
            id="refresh"
            type="button"
            aria-label="Refresh profiles"
            title="Refresh profiles"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"
              />
            </svg>
          </button>
        </div>
        <select
          class="field"
          id="profile"
          aria-describedby="network-warning"
          disabled
        >
          <option value="">Don't change Tailscale</option>
        </select>
        <p class="message warning" id="network-warning">
          Switching affects every app on this Mac and may interrupt other
          connections.
        </p>
        <label class="connect-option" id="connect-option" hidden>
          <input type="checkbox" id="connect-now" />
          Connect now
        </label>
        <div class="settings-actions">
          <button class="button text-button" id="open" type="button">
            Open Tailscale ↗
          </button>
          <button class="button" id="save" type="submit" disabled>Save</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">
        Reading local profiles…
      </p>
    </main>
  </body>
</html>
